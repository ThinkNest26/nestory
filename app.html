<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestory · Teacher</title>
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="content.js"></script>
<style>
  :root{--navy:#44546F;--ink:#2E3A4F;--blue:#7FA8DA;--blue2:#5F8FCB;--sky:#E3EDF8;--sky2:#F5F9FD;--green:#E2F1E8;--gink:#2D6248;--amber:#FFF4DE;--aink:#8A5A12;--rose:#FBEDE7;--rink:#9A4022;--muted:#6B7689;--line:#DCE6F2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:#F7F9FB;font-size:15px}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  h1,h2,h3{font-family:"Fredoka","Nunito",sans-serif;color:var(--navy);font-weight:600}
  .top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .top .in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:8px;font-family:"Fredoka";font-size:24px;color:var(--navy);font-weight:600;text-decoration:none}
  .brand img{height:40px}
  .tabs{display:flex;gap:4px;margin-left:12px;flex-wrap:wrap}
  .tabs button{padding:8px 10px;border-radius:12px;font-weight:800;color:var(--muted);font-size:14px;white-space:nowrap}
  .tabs button.on{background:var(--sky);color:var(--navy)}
  .tabs .n{background:var(--blue2);color:#fff;border-radius:999px;padding:1px 7px;font-size:12px;margin-left:4px}
  .sp{flex:1}
  .main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .between{justify-content:space-between}
  .btn{background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
  .btn.soft{background:var(--sky);color:var(--navy)}
  .btn.green{background:#C6E4D2;color:#24533D}
  .btn.small{padding:6px 11px;font-size:13px;border-radius:10px}
  .link{color:var(--blue2);font-weight:800}
  input,select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
  label{font-weight:800;font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
  .lbl{font-weight:900;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .hint{color:var(--muted);font-size:13px}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 4px;font-weight:800;font-size:13px;color:var(--navy);background:#fff;border:1px solid var(--line)}
  .chip i{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
  td{padding:10px 8px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
  tr.click{cursor:pointer}tr.click:hover td{background:var(--sky2)}
  .gap{font-weight:900}.gap.up{color:var(--gink)}.gap.dn{color:var(--rink)}
  .status{border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap}
  .s-test{background:var(--sky);color:var(--navy)}.s-ready{background:var(--green);color:var(--gink)}.s-down{background:var(--rose);color:var(--rink)}.s-slow{background:var(--amber);color:var(--aink)}.s-ok{background:#F1F3F6;color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat b{display:block;font-family:"Fredoka";font-size:28px;color:var(--navy);font-weight:600}
  .stat small{color:var(--muted);font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bars .b{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin-bottom:7px;font-weight:700;font-size:13px}
  .bars .t{height:12px;background:#EEF2F7;border-radius:8px;overflow:hidden}.bars .t i{display:block;height:100%;border-radius:8px;background:var(--blue)}
  .alert{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;margin-bottom:8px}
  .alert .tx{flex:1}
  .err{background:var(--rose);color:var(--rink);border-radius:12px;padding:10px 14px;font-weight:700;margin-bottom:14px}
  .login{max-width:420px;margin:60px auto}
  .login img{width:230px;display:block;margin:0 auto 10px}
  .empty{text-align:center;color:var(--muted);padding:34px}
  .codebox{background:var(--sky);border-radius:14px;padding:12px 16px;display:inline-block}
  .codebox b{font-family:"Fredoka";font-size:28px;letter-spacing:.12em;color:var(--navy);display:block}
  .journey{border-left:3px solid var(--line);margin-left:8px;padding-left:16px}
  .journey div{position:relative;margin-bottom:12px}
  .journey div::before{content:"";position:absolute;left:-24px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--c,#ccc);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;opacity:0;transition:.3s;pointer-events:none;z-index:50}.toast.show{opacity:1}
  .modal{position:fixed;inset:0;background:rgba(46,58,79,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:40;overflow:auto}
  .modal .box{background:#F7F9FB;border-radius:22px;max-width:900px;width:100%;padding:22px}
  .hero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#E3EDF8,#E2F1E8);border:0}
  .hero img{width:92px;flex-shrink:0}
  .how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .how div{background:var(--sky2);border-radius:14px;padding:14px}
  .how b{display:block;font-family:"Fredoka";font-size:17px;color:var(--navy);font-weight:600;margin:6px 0 4px}
  .how .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900}
  .step{display:flex;gap:14px;padding:16px 0;border-top:1px solid #EEF2F7}
  .step:first-of-type{border-top:0}
  .step .tick{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex-shrink:0;background:#F1F3F6;color:var(--muted)}
  .step.done .tick{background:#C6E4D2;color:#24533D}
  .step .bd{flex:1;min-width:0}
  .step h3{font-size:18px;margin-bottom:3px}
  .track{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .track .arrow{color:var(--muted);font-weight:900}
  .dots{display:inline-flex;gap:3px;vertical-align:middle}.dots i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
  .tracker{min-width:760px}
  .trow{display:grid;grid-template-columns:150px 1fr 120px 120px 90px;gap:14px;align-items:center;padding:10px 6px;border-bottom:1px solid #EEF2F7}
  .trow.click{cursor:pointer;border-radius:12px}.trow.click:hover{background:var(--sky2)}
  .trow.thead{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--line)}
  .ladder{display:flex;gap:3px}
  .seg{flex:1;height:34px;border-radius:9px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
  .seg.on{box-shadow:inset 0 0 0 1.5px rgba(68,84,111,.35)}
  .seg.now{box-shadow:inset 0 0 0 2.5px var(--navy)}
  .seg span{font-size:11px;font-weight:900;color:var(--navy);white-space:nowrap}
  .segname{flex:1;text-align:center;font-size:10px;border-top:5px solid var(--c,#ddd);padding-top:3px;border-radius:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0}
  .ra{display:block;font-family:"Fredoka";font-size:20px;font-weight:600;color:var(--navy)}
  .trow .hint{display:block;font-size:12px}
  .pill{display:inline-block;border-radius:999px;padding:5px 11px;font-weight:900;background:#F1F3F6;color:var(--muted)}
  .pill.up{background:var(--green);color:var(--gink)}.pill.dn{background:var(--rose);color:var(--rink)}
  .trk th,.trk td{text-align:center;white-space:nowrap;padding:8px 6px;font-size:13px}.trk th{font-size:11px}.trk th:first-child,.trk td:first-child{text-align:left;white-space:normal;min-width:130px}
  .trk tr.grp td{background:#F5F9FD;border-bottom:1px solid var(--line)}.trk tr.grp.sub td{background:#FAFCFE}
  .bdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .pill.mid{background:var(--amber);color:var(--aink)}
  .sn{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #EEF2F7}.sn:first-of-type{border-top:0}
  @media (max-width:860px){ .how{grid-template-columns:1fr 1fr} .hero{flex-direction:column;text-align:center} }
  @media (max-width:860px){ .stats{grid-template-columns:1fr 1fr} .grid2{grid-template-columns:1fr} .tabs{margin-left:0} .hide-sm{display:none} }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ===== CONFIG: the shared ThinkNest Supabase project (public values) ===== */
const SUPABASE_URL = "https://zmncqutjtgwxlvrdgwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_blNQT3mGUzNadaRARkRpew_dq-tmD4J";
const PICTURES = ["🐢","🐪","⭐","🍎","🚀","🐬","🌻","🦁","🎈","🐝","🍓","⚽"];
const GRADES = ["FS1","FS2","Year 1","Year 2","Year 3","Year 4","Year 5","Year 6"];
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "nestory-teacher" } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" }) : "–";
const chip = b => `<span class="chip"><i style="background:${bandColour(b)}"></i>${bandName(b)}</span>`;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 2200); }
const errMsg = e => (e && e.message) || "Something went wrong. Please try again.";

const S = { user: null, mode: "signin", tab: "start", school: null, schoolRole: "", schoolLoaded: false, classes: null, cls: null, kids: [], readers: [], tests: [], reads: [], moves: [], kid: null, error: "" };

/* ---------- sign in (same account as WonderNest) ---------- */
async function init(){
  const { data: { session } } = await db.auth.getSession();
  S.user = session && !session.user.is_anonymous ? session.user : null;
  db.auth.onAuthStateChange((ev, s) => { if(ev === "PASSWORD_RECOVERY"){ S.mode = "newpass"; render(); } });
  if(location.hash.includes("type=recovery")) S.mode = "newpass";
  if(S.user && S.mode !== "newpass") return loadClasses();
  render();
}
async function signIn(){
  S.error = "";
  const { data, error } = await db.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value });
  if(error){ S.error = error.message === "Invalid login credentials" ? "That email or password isn't right. Use the same account as WonderNest." : errMsg(error); return render(); }
  S.user = data.session.user; loadClasses();
}
async function forgot(){
  const em = $("#em").value.trim(); if(!em){ S.error = "Type your email first."; return render(); }
  await db.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
  toast("Check your email for a reset link");
}
async function newPass(){
  const p = $("#np").value; if(p.length < 8){ S.error = "Use at least 8 characters."; return render(); }
  const { error } = await db.auth.updateUser({ password: p }); if(error){ S.error = errMsg(error); return render(); }
  S.mode = "signin"; history.replaceState(null, "", location.pathname); toast("Password changed ✓"); init();
}
async function signOut(){ await db.auth.signOut(); S.user = null; S.classes = null; render(); }

/* ---------- data ---------- */
async function loadSchool(){
  try{
    const m = await db.from("school_members").select("school_id, role").eq("user_id", S.user.id);
    const mine = (m.data || [])[0];
    if(mine){ const sc = await db.from("schools").select("id, name, code").eq("id", mine.school_id).single(); S.school = sc.data || null; S.schoolRole = mine.role;
      const w = await db.from("ns_windows").select("*").eq("school_id", mine.school_id); S.windows = w.error ? [] : (w.data || []); }
    else { S.school = null; S.schoolRole = ""; }
  }catch(e){ S.school = null; }
  S.schoolLoaded = true;
}
async function joinSchool(){
  const code = $("#sc").value.trim(); if(code.length < 6){ S.error = "Please type the 8-character school code."; return render(); }
  const { data, error } = await db.rpc("join_school", { p_code: code });
  if(error){ S.error = errMsg(error); return render(); }
  if(!data.ok){ S.error = data.reason === "member" ? "You already belong to a school." : "We couldn't find that school code. Please check it with your coordinator."; return render(); }
  S.error = ""; toast("Welcome to " + data.name + " ✓"); await loadSchool(); render();
}
async function createSchool(){
  const name = $("#sn").value.trim(); if(name.length < 2){ S.error = "Please type your school's name."; return render(); }
  if(!confirm(`Create a new school called "${name}"? Only do this if nobody at your school has set it up yet. You will be the school admin.`)) return;
  const { data, error } = await db.rpc("create_school", { p_name: name, p_settings: { school: name } });
  if(error || !data || !data.ok){ S.error = errMsg(error); return render(); }
  S.error = ""; toast("Your school is ready ✓"); await loadSchool(); render();
}
async function loadClasses(){
  await loadSchool();
  const { data, error } = await db.from("classes").select("id, name, grade, code").order("created_at");
  if(error){ S.error = errMsg(error); }
  S.classes = data || [];
  const keep = localStorage.getItem("ns_class");
  const c = S.classes.find(x => x.id === keep) || S.classes[0];
  if(c) return openClass(c.id, true);
  S.tab = "start"; render();
}
async function openClass(id, first){
  S.cls = S.classes.find(c => c.id === id); localStorage.setItem("ns_class", id); S.kid = null;
  const [k, r, t, rd, m] = await Promise.all([
    db.from("students").select("id, first_name, picture").eq("class_id", id).order("first_name"),
    db.from("ns_readers").select("*").eq("class_id", id),
    db.from("ns_tests").select("*").eq("class_id", id).order("created_at"),
    db.from("ns_reads").select("id, student_id, band, text_id, comp, grammar, score, seconds, answers, created_at").eq("class_id", id).order("created_at"),
    db.from("ns_moves").select("*").eq("class_id", id).order("created_at")]);
  S.kids = k.data || []; S.readers = r.data || []; S.tests = t.data || []; S.reads = rd.data || []; S.moves = m.data || [];
  if(first) S.tab = S.kids.length && S.kids.every(k => testsOf(k.id).length) ? "class" : "start";
  render();
}
const reader = id => S.readers.find(r => r.student_id === id) || { band: 0, retest: true, rwi_group: "", birth_month: null, pending: null };
const testsOf = id => S.tests.filter(t => t.student_id === id && t.kind === "test");
const lastTest = id => testsOf(id).slice(-1)[0];
const ageAt = (r, when) => { if(!r.birth_month) return null; const b = new Date(r.birth_month), n = when ? new Date(when) : new Date(); return (n.getFullYear() - b.getFullYear()) * 12 + n.getMonth() - b.getMonth(); };
const ageNow = r => ageAt(r);
const ageAtTest = (r, t) => t.actual_age != null ? t.actual_age : ageAt(r, t.created_at);
const gapOf = (r, t) => { const a = t ? ageAtTest(r, t) : null; return a == null ? null : t.reading_age - a; };
/* Reading journey: the first test is the starting point; every later test or band move updates the reading age and colour. */
function buildJourney(tests, moves, birth){
  const ev = [];
  tests.forEach(t => ev.push({ at: t.at, band: t.band, ra: t.ra, how: "Reading test" }));
  moves.filter(m => m.reason !== "test" && m.from !== m.to && m.to).forEach(m => ev.push({ at: m.at, band: m.to, how: ({ check: "Band check", teacher: "Teacher", texts: "Texts" })[m.reason] || m.reason }));
  ev.sort((a, b) => a.at < b.at ? -1 : 1);
  let ra = null; const out = [];
  ev.forEach(e => {
    if(e.ra == null){ const B = BANDS[e.band]; if(!B) return; if(ra == null) ra = B[4]; e.ra = e.band > (out.length ? out[out.length - 1].band : 0) ? Math.max(ra, B[4]) : Math.min(ra, B[5] - 1); }
    ra = e.ra; e.aa = ageAt({ birth_month: birth }, e.at); out.push(e);
  });
  return out;
}
function journey(id){
  return buildJourney(S.tests.filter(t => t.student_id === id && t.kind === "test").map(t => ({ at: t.created_at, band: t.band, ra: t.reading_age })),
    S.moves.filter(m => m.student_id === id).map(m => ({ at: m.created_at, from: m.from_band, to: m.to_band, reason: m.reason })), reader(id).birth_month);
}
const startOf = id => journey(id)[0] || null;
const nowOf = id => journey(id).slice(-1)[0] || null;
const grewOf = id => { const j = journey(id); return j.length ? j[j.length - 1].ra - j[0].ra : null; };
const gapNow = id => { const n = nowOf(id), a = ageNow(reader(id)); return n && a != null ? n.ra - a : null; };
const raTag = e => e ? `${chip(e.band)} <b>${fmtAge(e.ra)}</b>` : `<span class="hint">–</span>`;
function sinceMove(id){ const mv = S.moves.filter(m => m.student_id === id).slice(-1)[0]; return mv ? mv.created_at : ""; }
function readsInBand(id){ const r = reader(id), since = sinceMove(id); return S.reads.filter(x => x.student_id === id && x.band === r.band && x.created_at > since); }
function avgLast(id, n){ const rs = readsInBand(id).slice(-n); return rs.length ? Math.round(rs.reduce((a, x) => a + x.score, 0) / rs.length) : null; }
function progressRate(id){ const ts = testsOf(id); if(ts.length < 2) return null; const a = ts[ts.length - 2], b = ts[ts.length - 1];
  const months = (new Date(b.created_at) - new Date(a.created_at)) / (30.44 * 864e5); if(months < 1) return null; return Math.round((b.reading_age - a.reading_age) / months * 10) / 10; }
function statusOf(id){
  const r = reader(id), rs = readsInBand(id).slice(-5);
  if(r.pending) return ["down", `Move to ${bandName(r.pending.to)}?`];
  if(r.retest || !r.band) return ["test", r.band ? "Retest set" : "Not tested"];
  if(rs.length === 5 && rs.reduce((a, x) => a + x.score, 0) / 5 >= 80 && r.band < 20) return ["ready", "Ready for band check"];
  const pr = progressRate(id); if(pr !== null && pr < 1) return ["slow", "Progress slowed"];
  return ["ok", "On track"];
}

/* ---------- teacher actions ---------- */
async function setBand(id, band, note){
  const { data, error } = await db.rpc("ns_set_band", { p_student: id, p_band: band, p_note: note || "" });
  if(error){ S.error = errMsg(error); return render(); }
  const keep = S.kid; toast(band === null ? "Kept in band ✓" : `Moved to ${bandName(band)} ✓`); await openClass(S.cls.id); S.kid = keep; render();
}
async function setInfo(id, patch){
  const r = reader(id);
  const { error } = await db.rpc("ns_set_info", { p_student: id, p_rwi: patch.rwi ?? null, p_birth: patch.birth ?? null, p_retest: patch.retest ?? null });
  if(error){ S.error = errMsg(error); return render(); }
  toast(patch.retest ? "Reading test set ✓ The child will see it when they sign in" : "Saved ✓"); await openClass(S.cls.id); S.kid = id; render();
}
async function retestAll(){ if(!confirm("Ask every child in this class to take the reading test again?")) return; for(const k of S.kids) await db.rpc("ns_set_info", { p_student: k.id, p_rwi: null, p_birth: null, p_retest: true }); toast("Reading test set for the class ✓"); openClass(S.cls.id); }
async function addClass(){
  const name = $("#cn").value.trim(), grade = $("#cg").value; if(!name) return;
  const { data, error } = await db.from("classes").insert({ name, grade }).select("id, name, grade, code").single();
  if(error){ S.error = errMsg(error); return render(); }
  toast("Class created ✓"); S.classes.push(data); if(S.tab !== "start") S.tab = "children"; openClass(data.id);
}
async function addKids(){
  const names = $("#nk").value.split(/\n|,/).map(n => n.trim()).filter(Boolean).slice(0, 60); if(!names.length) return;
  const used = S.kids.map(k => k.picture);
  const rows = names.map(n => { const free = PICTURES.filter(p => !used.includes(p)), pool = free.length ? free : PICTURES, pic = pool[Math.floor(Math.random() * pool.length)]; used.push(pic); return { class_id: S.cls.id, first_name: n.slice(0, 40), picture: pic }; });
  const { error } = await db.from("students").insert(rows); if(error){ S.error = errMsg(error); return render(); }

  return `<div class="card" style="overflow-x:auto"><div class="lbl">📈 Reading tracker · starting point → now</div><div class="tracker">${head}${body}</div>
    <p class="hint" style="margin-top:10px">Each colour is a reading band. <b>Start</b> is the band from the first reading test. <b>Now</b> is the band today.${exp ? ` ★ is the expected band for ${esc(S.cls.grade)}.` : ""} Tap a child to see their chart.</p></div>`;

const todayISO = () => new Date().toISOString().slice(0, 10);
function acYear(d){ const x = d ? new Date(d) : new Date(), y = x.getMonth() >= 7 ? x.getFullYear() : x.getFullYear() - 1; return `${y}-${String(y + 1).slice(2)}`; }
function yearWindows(list, year){ return (list || []).filter(w => w.year_label === year).sort((a, b) => a.idx - b.idx); }
function yearsOf(list){ const ys = [...new Set((list || []).map(w => w.year_label))].sort(); return ys.length ? ys : [acYear()]; }
function pickYear(list){ const ys = yearsOf(list); if(S.year && ys.includes(S.year)) return S.year; return ys.includes(acYear()) ? acYear() : ys[ys.length - 1]; }
function normChild(c){
  const j = buildJourney(c.tests.filter(t => t.kind === "test"), c.moves, c.birth), age = ageAt({ birth_month: c.birth });
  const an = analyseChild({ first_name: c.name, band: c.band, grade: c.grade, journey: j, tests: c.tests, reads: c.reads || [] });
  return Object.assign({}, c, { j, start: j[0] || null, now: j[j.length - 1] || null, grew: j.length ? j[j.length - 1].ra - j[0].ra : null,
    gap: j.length && age != null ? j[j.length - 1].ra - age : null, exp: expectedBand(c.grade), an });
}
function classChild(k){
  const r = reader(k.id);
  return normChild({ id: k.id, name: k.first_name, pic: k.picture, band: r.band, grade: S.cls.grade, birth: r.birth_month,
    tests: S.tests.filter(t => t.student_id === k.id).map(t => ({ at: t.created_at, kind: t.kind, band: t.band, ra: t.reading_age, score: t.score, skills: t.skills, window_id: t.window_id })),
    moves: S.moves.filter(m => m.student_id === k.id).map(m => ({ at: m.created_at, from: m.from_band, to: m.to_band, reason: m.reason })),
    reads: S.reads.filter(x => x.student_id === k.id).map(x => Object.assign({ at: x.created_at }, x)) });
}
const scoreCls = v => v >= 80 ? "up" : v >= 60 ? "mid" : "dn";
const dot = b => b ? `<i class="bdot" style="background:${bandColour(b)}" title="${bandName(b)}"></i>` : "";
function checkCell(c, w){
  const t = c.tests.find(x => x.window_id === w.id), td = todayISO();
  if(t) return w.kind === "age" ? `<b>${fmtAge(t.ra)}</b><br>${dot(t.band)}<span class="hint">${bandName(t.band)}</span>` : `<span class="pill ${scoreCls(t.score)}">${t.score}%</span><br>${dot(t.band)}<span class="hint">${bandName(t.band)}</span>`;
  if(td > w.closes) return `<span class="hint">missed</span>`;
  if(td >= w.opens) return `<span class="pill mid">open</span>`;
  return `<span class="hint">–</span>`;
}
function groupCell(rows, w){
  const done = rows.map(c => c.tests.find(x => x.window_id === w.id)).filter(Boolean); if(!done.length) return `<span class="hint">–</span>`;
  if(w.kind === "age"){ const a = avgOf(done.map(t => t.ra)); return `<b>${fmtAge(a)}</b><br><span class="hint">${done.length}/${rows.length} done</span>`; }
  const a = avgOf(done.map(t => t.score)); return `<span class="pill ${scoreCls(a)}">${a}%</span><br><span class="hint">${done.length}/${rows.length} done</span>`;
}
const raBand = e => e ? `<b>${fmtAge(e.ra)}</b><br>${dot(e.band)}<span class="hint">${bandName(e.band)}</span>` : `<span class="hint">Not tested</span>`;
const nextChip = c => { const s = c.an.gaps[0] || c.an.developing[0]; return s ? `<span class="chip" style="padding:3px 10px">${SKILL_NAMES[s.skill] || s.skill}</span>` : c.an.enough ? `<span class="hint">On track</span>` : `<span class="hint">–</span>`; };
function trackerHead(ws, first, last){
  return `<tr><th>${first}</th><th>Baseline</th>${ws.map(w => `<th title="${esc(w.title)}">${esc(CHECKS[w.idx - 1].short)}<br><span class="hint" style="text-transform:none;letter-spacing:0;font-weight:700">${w.kind === "age" ? "reading age" : "band check"}</span></th>`).join("")}<th>Now</th><th>Progress</th><th>Vs age</th><th>${last}</th></tr>`;
}
function childTrackRow(c, ws, click){
  return `<tr class="${click ? "click" : ""}" ${click ? `onclick="${click}"` : ""}><td><b>${esc(c.pic || "")} ${esc(c.name)}</b>${c.start ? `<br><span class="hint">since ${fmtDate(c.start.at)}</span>` : ""}</td><td>${raBand(c.start)}</td>${ws.map(w => `<td>${checkCell(c, w)}</td>`).join("")}
    <td>${c.j.length > 1 ? raBand(c.now) : c.now ? `<span class="hint">same</span>` : "–"}</td><td>${c.grew == null ? "–" : `<span class="gap ${c.grew > 0 ? "up" : c.grew < 0 ? "dn" : ""}">${signed(c.grew)}</span>`}</td>
    <td>${c.gap == null ? `<span class="hint" title="Add the child's birth month in their profile">${c.now ? "no DOB" : "–"}</span>` : `<span class="gap ${c.gap >= 0 ? "up" : "dn"}">${signed(c.gap)}</span>`}</td><td>${nextChip(c)}</td></tr>`;
}
function groupTrackRow(label, sub, rows, ws, click, open){
  const T = rows.filter(c => c.start), E = T.filter(c => c.exp), gaps = T.filter(c => c.gap != null);
  return `<tr class="grp ${click ? "click" : ""}" ${click ? `onclick="${click}"` : ""}><td><b>${click ? (open ? "▾ " : "▸ ") : ""}${esc(label)}</b><br><span class="hint">${esc(sub || "")}${sub ? " · " : ""}${rows.length} children · ${T.length} tested</span></td>
    <td>${T.length ? `<b>${fmtAge(avgOf(T.map(c => c.start.ra)))}</b><br><span class="hint">average</span>` : "–"}</td>${ws.map(w => `<td>${groupCell(rows, w)}</td>`).join("")}
    <td>${T.length ? `<b>${fmtAge(avgOf(T.map(c => c.now.ra)))}</b>` : "–"}</td><td>${T.length ? `<span class="gap ${avgOf(T.map(c => c.grew)) > 0 ? "up" : ""}">${signed(avgOf(T.map(c => c.grew)))}</span>` : "–"}</td>
    <td>${gaps.length ? `<span class="gap ${avgOf(gaps.map(c => c.gap)) >= 0 ? "up" : "dn"}">${signed(avgOf(gaps.map(c => c.gap)))}</span>` : "–"}</td><td>${E.length ? `<b>${pct(E.filter(c => c.band >= c.exp).length, E.length)}</b><br><span class="hint">at or above expected</span>` : "–"}</td></tr>`;
}
function datesNote(ws, admin){
  if(ws.length) return "";
  return `<div class="alert" style="background:var(--amber)"><div class="tx"><b>📅 The six reading checks haven't been given dates yet.</b><br><span class="hint">${admin ? "Set them in the 🏫 Whole school tab." : S.school ? "Your school admin sets them in the Whole school tab." : "Join your school first (🏠 Start here), then your school admin sets the dates."}</span></div></div>`;
}
function groupsCard(rows){
  const gg = gapGroups(rows.filter(c => c.an.enough).map(c => ({ name: c.name, analysis: c.an })));
  return `<div class="card"><div class="lbl">🎯 Next-step groups</div>${gg.length ? gg.map(([sk, names]) => `<div class="alert" style="background:var(--sky2);align-items:flex-start"><div class="tx"><b>${SKILL_NAMES[sk] || sk}</b> · ${names.length} ${names.length === 1 ? "child" : "children"}: ${names.map(esc).join(", ")}<br><span class="hint">${esc(NEXT_STEPS[sk].teacher)}</span></div></div>`).join("")
    : `<p class="hint">Groups appear once children have taken a check or read a few texts.</p>`}<p class="hint" style="margin-top:6px">Based on the reading test, the band checks and the questions children answer in their texts. A skill is a gap below 60% and developing from 60% to 79%.</p></div>`;

function skillBars(prof){

  return e.length ? `<div class="bars">${e.map(([s, v]) => `<div class="b"><span>${SKILL_NAMES[s] || s}</span><div class="t"><i style="width:${v}%;background:${v >= 80 ? "#8FC9A8" : v >= 60 ? "#F1C27D" : "#E6A595"}"></i></div><span>${v}%</span></div>`).join("")}</div>` : `<p class="hint">Appears after the first check or a few texts.</p>`;
}
function progressView(){
  const ws = yearWindows(S.windows, pickYear(S.windows)), rows = S.kids.map(classChild), years = yearsOf(S.windows);
  const prof = {}; rows.forEach(c => Object.entries(c.an.profile).forEach(([s, v]) => (prof[s] = prof[s] || []).push(v)));

    ${datesNote(ws, S.schoolRole === "admin")}
    <div class="card" style="overflow-x:auto"><div class="lbl">📈 Reading tracker: baseline → checks → now</div>
      <table class="trk">${trackerHead(ws, "Child", "Next step")}${rows.map(c => childTrackRow(c, ws, `S.kid='${c.id}';render()`)).join("")}${groupTrackRow("Class average", "", rows, ws)}</table>

    <div class="grid2">${groupsCard(rows)}<div class="card"><div class="lbl">Class reading skills</div>${skillBars(classProf)}</div></div>

function suggestDates(year){
  const y = +year.slice(0, 4), d = (yy, m, dd) => `${yy}-${String(m).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
  return [[d(y, 10, 12), d(y, 10, 23)], [d(y, 11, 30), d(y, 12, 11)], [d(y + 1, 2, 8), d(y + 1, 2, 19)], [d(y + 1, 3, 15), d(y + 1, 3, 26)], [d(y + 1, 5, 10), d(y + 1, 5, 21)], [d(y + 1, 6, 14), d(y + 1, 6, 25)]];
}
function datesCard(list){
  const year = S.editYear || pickYear(list), ws = yearWindows(list, year), sug = suggestDates(year);
  return `<div class="card"><div class="row between"><div class="lbl">📅 Reading check dates</div><div class="row"><label style="margin:0">School year</label><input id="wy" value="${esc(year)}" style="width:110px" onchange="S.editYear=this.value;render()"><button class="btn soft small" onclick="fillSuggested()">Fill suggested dates</button></div></div>
    <p class="hint" style="margin:4px 0 10px">Two checks a term. Mid-term: an unseen text at each child's band. End of term: the full reading-age test with unseen passages. Each check opens for every class on the first date and closes on the second.</p>

      return `<tr><td><b>${c.title}</b></td><td class="hint">${c.kind === "age" ? "Reading-age test" : "Band check"}</td><td><input type="date" id="wo${c.idx}" value="${w ? w.opens : ""}" data-s="${sug[i][0]}"></td><td><input type="date" id="wc${c.idx}" value="${w ? w.closes : ""}" data-s="${sug[i][1]}"></td></tr>`; }).join("")}</table>
    <button class="btn" style="margin-top:12px" onclick="saveDates()">Save check dates</button></div>`;
}
function fillSuggested(){ CHECKS.forEach(c => { ["wo", "wc"].forEach(p => { const el = $("#" + p + c.idx); if(el && !el.value) el.value = el.dataset.s; }); }); toast("Suggested dates added. Change any you need, then save."); }
async function saveDates(){
  const year = $("#wy").value.trim() || acYear(), list = [];
  for(const c of CHECKS){ const o = $("#wo" + c.idx).value, cl = $("#wc" + c.idx).value; if(!o && !cl) continue; if(!o || !cl){ S.error = `Please give ${c.title} both dates.`; return render(); } list.push({ idx: c.idx, kind: c.kind, title: c.title, opens: o, closes: cl }); }
  const { error } = await db.rpc("ns_set_windows", { p_year: year, p_windows: list });
  if(error){ S.error = errMsg(error); return render(); }
  S.error = ""; S.editYear = year; S.year = year; toast("Check dates saved for the whole school ✓"); await loadSchool(); S.sch = null; render();
}

/* ---------- whole-school view (school admins) ---------- */
async function loadSchoolOverview(){
  const { data, error } = await db.rpc("ns_school_overview");
  S.sch = error ? { error: errMsg(error) } : (data || { classes: [], children: [] }); render();
}

function schoolKids(){
  const o = S.sch;
  return o.children.map(c => { const cls = o.classes.find(x => x.id === c.class_id) || {};
    return Object.assign(normChild({ id: c.id, class_id: c.class_id, name: c.name, band: c.band, grade: cls.grade, birth: c.birth, tests: c.tests || [], moves: c.moves || [], reads: [] }), { cls, reads: c.reads, recent: c.recent }); });
}
function bandBar(list){

  return `<div style="display:flex;height:16px;border-radius:8px;overflow:hidden;background:#F1F3F6;min-width:140px">${Object.keys(counts).map(Number).sort((a, b) => a - b).map(b => `<i title="${bandName(b)}: ${counts[b]}" style="width:${counts[b] / n * 100}%;background:${b ? bandColour(b) : "#F1F3F6"};box-shadow:inset -1px 0 0 #fff"></i>`).join("")}</div>`;
}
const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
const avgOf = a => { a = a.filter(x => x != null); return a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null; };
const signed = v => v == null ? "–" : (v > 0 ? "+" : "") + v + "m";
function gradeKey(g){ const y = yearOf(g); return y == null ? (g || "Other") : y < 1 ? (y === -1 ? "FS1" : "FS2") : "Year " + y; }

    <div class="stats"><div class="stat"><small>Children</small><b>${K.length}</b></div><div class="stat"><small>Baseline taken</small><b>${pct(tested.length, K.length)}</b></div>

function exportSchoolCSV(){

    ...ws.map(w => { const t = k.tests.find(x => x.window_id === w.id); return t ? (w.kind === "age" ? fmtAge(t.ra) : t.score) : ""; }),

/* ---------- one-page parent report ---------- */
const LOGO_IMG = new Image(); LOGO_IMG.src = "logo.png";
function logoData(){ try{ const c = document.createElement("canvas"); c.width = LOGO_IMG.naturalWidth; c.height = LOGO_IMG.naturalHeight; c.getContext("2d").drawImage(LOGO_IMG, 0, 0); return c.toDataURL("image/png"); }catch(e){ return "logo.png"; } }
const HOME_TIPS = b => b <= 4 ? ["Share picture books every day and talk about the pictures together.", "Practise the sounds your child is learning in school (Read Write Inc.).", "When they read to you, help them point to each word and blend the sounds."]
  : b <= 10 ? ["Listen to your child read for 10 minutes every day, and praise their effort.", "Ask questions as you read: who, what, where, when and why?", "Keep reading aloud to them too. Stories above their level build vocabulary."]
  : b <= 16 ? ["Make time for reading for pleasure every day, including comics, magazines and non-fiction.", "Talk about books: favourite characters, predictions and new words.", "Visit the library together and let them choose."]
  : ["Offer challenging and varied reading: novels, non-fiction, poetry and news.", "Discuss the writer's choices: why this word, why this ending?", "Encourage them to share their opinions about what they read and back them up."];
function parentReport(id){
  const k = S.kids.find(x => x.id === id), r = reader(id), j = journey(id), s0 = j[0], n0 = j[j.length - 1], t = lastTest(id), rd = S.reads.filter(x => x.student_id === id), last5 = rd.slice(-5);
  if(!s0) return toast(`${k.first_name} hasn't taken the reading test yet`);
  const cc = classChild(k), an = cc.an;
  const gr = n0.ra - s0.ra, avg = last5.length ? Math.round(last5.reduce((a, x) => a + x.comp, 0) / last5.length) : null, base = location.href.replace(/[^/]*$/, "");
  const box = (label, e, sub) => `<div class="b"><small>${label}</small><div class="dot" style="background:${bandColour(e.band)}"></div><b>${bandName(e.band)}</b><span>Reading age ${fmtAge(e.ra)}</span><em>${sub}</em></div>`;
  const w = window.open("", "_blank"); if(!w) return toast("Please allow pop-ups to open the report");
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Reading report · ${esc(k.first_name)}</title><style>
    @page{size:A4;margin:14mm}body{font-family:Arial,sans-serif;color:#2E3A4F;margin:0 auto;max-width:760px;font-size:13px}h1{font-size:24px;margin:0;color:#44546F}h2{font-size:15px;color:#44546F;margin:16px 0 6px;border-bottom:2px solid #DCE6F2;padding-bottom:3px}
    .top{display:flex;align-items:center;gap:14px;border-bottom:3px solid #7FA8DA;padding-bottom:10px}.top img{height:54px}.top .sp{flex:1}.muted{color:#6B7689}
    .boxes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.b{border:1px solid #DCE6F2;border-radius:12px;padding:10px;text-align:center}.b small{display:block;color:#6B7689;font-weight:bold;text-transform:uppercase;font-size:10px;letter-spacing:.05em}
    .b .dot{width:34px;height:34px;border-radius:50%;margin:6px auto;box-shadow:0 0 0 1px rgba(0,0,0,.12)}.b b{display:block;font-size:17px}.b span{display:block}.b em{display:block;color:#6B7689;font-style:normal;font-size:11px}
    .big{font-size:30px;font-weight:bold;color:#2D6248;margin-top:10px}.bars div{display:grid;grid-template-columns:140px 1fr 40px;gap:8px;align-items:center;margin:4px 0}.bars i{display:block;height:9px;border-radius:5px;background:#7FA8DA}.bars .t{background:#EEF2F7;border-radius:5px}
    ul{margin:4px 0 0 18px;padding:0}li{margin:3px 0}.lines div{border-bottom:1px solid #C9D2DE;height:24px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media print{button{display:none}}</style></head><body>
    <button onclick="print()" style="padding:8px 16px;font-size:14px;margin:10px 0">🖨️ Print or save as PDF</button>
    <div class="top"><img src="${logoData()}" alt="Nestory"><div class="sp"><h1>Reading report: ${esc(k.first_name)}</h1><div class="muted">${esc(S.cls.name)} · ${esc(S.cls.grade)} · ${new Date().toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" })}</div></div></div>
    <h2>Reading journey</h2><div class="boxes">${box("Starting point", s0, fmtDate(s0.at))}${box("Now", n0, j.length > 1 ? fmtDate(n0.at) : "same as start")}
      <div class="b"><small>Progress</small><div class="big">${gr > 0 ? "+" : ""}${gr} months</div><em>${gr > 0 ? "growth in reading age since the first test" : "since the first test"}</em>${r.birth_month ? `<em style="margin-top:6px">Age now: ${fmtAge(ageNow(r))}</em>` : ""}</div></div>
    <h2>Reading age over time</h2>${svgReading(id)}
    <div class="two"><div><h2>Reading skills</h2>${Object.keys(an.profile).length ? `<div class="bars">${Object.entries(an.profile).sort((a, b) => SKILL_ORDER.indexOf(a[0]) - SKILL_ORDER.indexOf(b[0])).map(([s, v]) => `<div><span>${SKILL_NAMES[s] || s}</span><span class="t"><i style="width:${v}%;background:${v >= 80 ? "#8FC9A8" : v >= 60 ? "#F1C27D" : "#E6A595"}"></i></span><span>${v}%</span></div>`).join("")}</div>` : `<p class="muted">Appears after the first check.</p>`}
      <h2>Reading in school</h2><p><b>${rd.length}</b> ${rd.length === 1 ? "text" : "texts"} read in Nestory${avg != null ? `, with an average of <b>${avg}%</b> for understanding over the last ${last5.length}` : ""}.</p>
      <p style="margin-top:6px"><b>Grammar ${esc(k.first_name)} is learning now:</b> ${esc(BANDS[r.band || n0.band][6])}.</p></div>
      <div>${an.strengths.length ? `<h2>What ${esc(k.first_name)} does well</h2><p>${an.strengths.slice(0, 3).map(x => SKILL_NAMES[x.skill]).join(", ")}.</p>` : ""}
      <h2>Next steps and how you can help</h2><ul>${[...an.next.map(n => `<b>${SKILL_NAMES[n.skill]}:</b> ${esc(n.parent)}`), ...an.flags.filter(f => f.parent).map(f => esc(f.parent)), ...(an.next.length ? [] : HOME_TIPS(r.band || n0.band).map(esc))].slice(0, 4).map(x => `<li>${x}</li>`).join("")}</ul>
      <h2>Teacher's comment</h2><div class="lines"><div></div><div></div><div></div><div></div></div></div></div>
    <p class="muted" style="margin-top:14px;font-size:11px">Colour bands show the level of books ${esc(k.first_name)} is reading. Reading age is an estimate from the Nestory reading test and band checks.</p>
    </body></html>`);
  w.document.close();
}

function svgReading(id){
  const J = journey(id); if(!J.length) return `<p class="hint">No tests yet.</p>`;
  const r = reader(id), pts = J.map(e => ({ d: new Date(e.at), ra: e.ra, aa: e.aa, band: e.band }));
  const vals = pts.flatMap(p => [p.ra, p.aa]).filter(v => v != null), lo = Math.min(...vals) - 6, hi = Math.max(...vals) + 6;
  const W = 560, H = 220, x = i => 50 + (pts.length === 1 ? (W - 80) / 2 : i * (W - 80) / (pts.length - 1)), y = v => H - 30 - (v - lo) / (hi - lo) * (H - 50);
  const line = (k, col, dash) => { const p = pts.map((q, i) => q[k] == null ? null : `${x(i)},${y(q[k])}`).filter(Boolean); return p.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-width="3" ${dash ? 'stroke-dasharray="6 5"' : ""} points="${p.join(" ")}"/>` : ""; };
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${[lo, (lo + hi) / 2, hi].map(v => `<line x1="45" x2="${W - 20}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF2F7"/><text x="4" y="${y(v) + 4}" font-size="11" fill="#6B7689">${fmtAge(Math.round(v))}</text>`).join("")}
    ${line("aa", "#C9D2DE", true)}${pts.map((p, i) => p.aa == null ? "" : `<circle cx="${x(i)}" cy="${y(p.aa)}" r="4" fill="#C9D2DE"/>`).join("")}${line("ra", "#5F8FCB")}${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.ra)}" r="8" fill="${bandColour(p.band)}" stroke="#5F8FCB" stroke-width="2.5"><title>${bandName(p.band)} · ${fmtAge(p.ra)}</title></circle>${i === 0 ? `<text x="${x(i)}" y="${y(p.ra) - 13}" font-size="11" font-weight="bold" fill="#44546F" text-anchor="middle">Start</text>` : ""}<text x="${x(i)}" y="${H - 8}" font-size="11" fill="#6B7689" text-anchor="middle">${fmtDate(p.d)}</text>`).join("")}</svg>
    <p class="hint"><span style="color:#5F8FCB;font-weight:900">━</span> Reading age (dots show the band colour) ${r.birth_month ? `<span style="color:#9AA5B5;font-weight:900;margin-left:10px">┅</span> Actual age` : "· add a birth month to compare with actual age"}</p>`;
}
function insightHTML(c){
  const an = c.an; if(!an.enough && !an.flags.length) return `<p class="hint">Appears after the first check or a few texts.</p>`;
  const line = (ic, title, text) => `<div class="sn"><div style="font-size:20px">${ic}</div><div><b>${title}</b>${text ? `<br><span class="hint">${esc(text)}</span>` : ""}</div></div>`;
  return (an.strengths.length ? line("⭐", "Strengths: " + an.strengths.slice(0, 3).map(x => `${SKILL_NAMES[x.skill]} (${x.pct}%)`).join(", "), "") : "")
    + an.next.map(n => line("🎯", `${SKILL_NAMES[n.skill]} (${n.pct}%)`, n.teacher)).join("")
    + an.flags.map(f => line(f.level === "good" ? "🌟" : f.level === "high" ? "⚠️" : "💡", "", f.teacher)).join("");
}
function checksTable(c){
  const ws = yearWindows(S.windows, pickYear(S.windows)), rows = [];
  if(c.start) rows.push(`<tr><td><b>Baseline</b><br><span class="hint">${fmtDate(c.start.at)}</span></td><td>${dot(c.start.band)}${bandName(c.start.band)}</td><td><b>${fmtAge(c.start.ra)}</b></td></tr>`);
  ws.forEach(w => { const t = c.tests.find(x => x.window_id === w.id);
    rows.push(`<tr><td><b>${esc(w.title)}</b><br><span class="hint">${fmtDate(w.opens)} – ${fmtDate(w.closes)}</span></td><td>${t ? dot(t.band) + bandName(t.band) : ""}</td><td>${t ? (w.kind === "age" ? `<b>${fmtAge(t.ra)}</b>` : `<span class="pill ${scoreCls(t.score)}">${t.score}%</span>`) : checkCell(c, w)}</td></tr>`); });
  return rows.length ? `<table><tr><th>Check</th><th>Band</th><th>Result</th></tr>${rows.join("")}</table>${ws.length ? "" : `<p class="hint" style="margin-top:6px">Check dates haven't been set yet.</p>`}` : `<p class="hint">No checks yet.</p>`;
}
function kidModal(){
  const k = S.kids.find(x => x.id === S.kid); if(!k) return "";
  const cc = classChild(k), r = reader(k.id), t = lastTest(k.id), a = ageNow(r), mv = S.moves.filter(m => m.student_id === k.id).slice().reverse(), rd = S.reads.filter(x => x.student_id === k.id).slice().reverse(), pr = progressRate(k.id);
  return `<div class="modal" onclick="if(event.target===this){S.kid=null;render()}"><div class="box">
    <div class="row between" style="margin-bottom:14px"><h1>${esc(k.picture)} ${esc(k.first_name)}</h1><div class="row"><button class="btn small" onclick="parentReport('${k.id}')">🖨️ Parent report</button><button class="btn soft small" onclick="S.kid=null;render()">Close</button></div></div>
    ${(() => { const s0 = startOf(k.id), n0 = nowOf(k.id), gr = grewOf(k.id), g = gapNow(k.id); return `<div class="stats"><div class="stat"><small>Starting point${s0 ? " · " + fmtDate(s0.at) : ""}</small><b style="font-size:18px">${s0 ? raTag(s0) : "Not tested"}</b></div><div class="stat"><small>Now</small><b style="font-size:18px">${n0 ? raTag(n0) : "–"}</b></div><div class="stat"><small>Progress since start</small><b>${gr == null ? "–" : (gr > 0 ? "+" : "") + gr + "m"}</b></div><div class="stat"><small>Actual age</small><b>${fmtAge(a)}</b></div><div class="stat"><small>Gap now</small><b>${g == null ? "–" : (g >= 0 ? "+" : "") + g + "m"}</b></div></div>`; })()}
    <div class="grid2"><div class="card"><div class="lbl">Reading age and band over time</div>${svgReading(k.id)}</div>
      <div class="card"><div class="lbl">Reading skills</div>${skillBars(cc.an.profile)}<p class="hint" style="margin-top:6px">From the reading test, band checks and the questions in their texts.</p></div></div>
    <div class="grid2"><div class="card"><div class="lbl">⭐ Strengths and 🎯 next steps</div>${insightHTML(cc)}</div>
      <div class="card" style="overflow-x:auto"><div class="lbl">📅 Checks this year</div>${checksTable(cc)}</div></div>
    <div class="grid2"><div class="card"><div class="lbl">Settings</div>
        <label>Move to a band</label><div class="row"><select id="mb" style="flex:1">${BANDS.slice(1).map(b => `<option value="${b[0]}" ${b[0] === r.band ? "selected" : ""}>${b[0]}. ${b[1]} (${b[3]})</option>`).join("")}</select><button class="btn small" onclick="setBand('${k.id}', +$('#mb').value, $('#mn').value || 'teacher choice')">Move</button></div>
        <input id="mn" placeholder="Reason (optional)" style="margin-top:6px">
        <label style="margin-top:12px">RWI group</label><select onchange="setInfo('${k.id}', { rwi: this.value })">${RWI_GROUPS.map(g => `<option value="${g}" ${g === r.rwi_group ? "selected" : ""}>${g || "Not on RWI"}</option>`).join("")}</select>
        ${r.rwi_group && RWI_BAND[r.rwi_group] && RWI_BAND[r.rwi_group] !== r.band ? `<p class="hint" style="margin-top:4px">RWI ${esc(r.rwi_group)} matches ${chip(RWI_BAND[r.rwi_group])} <button class="link" onclick="setBand('${k.id}', ${RWI_BAND[r.rwi_group]}, 'RWI group')">Use it</button></p>` : ""}
        <label style="margin-top:12px">Birth month (for reading age gap)</label><input type="month" value="${r.birth_month ? String(r.birth_month).slice(0, 7) : ""}" onchange="if(this.value)setInfo('${k.id}', { birth: this.value + '-01' })">
        <button class="btn soft" style="margin-top:14px" onclick="setInfo('${k.id}', { retest: true })" ${r.retest ? "disabled" : ""}>🗺️ ${r.retest ? "Reading test is set" : "Ask to retake the reading test"}</button></div>
      <div class="card"><div class="lbl">Band journey</div>${mv.length ? `<div class="journey">${mv.slice(0, 12).map(m => `<div style="--c:${bandColour(m.to_band)}"><b>${m.from_band === m.to_band ? `Stayed in ${bandName(m.to_band)}` : `${m.from_band ? bandName(m.from_band) + " → " : ""}${bandName(m.to_band)}`}</b> <span class="hint">· ${fmtDate(m.created_at)}</span><br><span class="hint">${({ test: "Reading test", check: "Band check", teacher: "Teacher", texts: "Texts" })[m.reason] || esc(m.reason)}${m.note ? ": " + esc(m.note) : ""}</span></div>`).join("")}</div>` : `<p class="hint">No moves yet.</p>`}</div></div>
    <div class="card"><div class="lbl">Texts read (${rd.length})</div>${rd.length ? `<table><tr><th>Text</th><th>Band</th><th>Understanding</th><th>Grammar</th><th>Date</th></tr>${rd.slice(0, 15).map(x => `<tr><td>${esc((TEXTS.find(t => t.id === x.text_id) || {}).title || x.text_id)}</td><td>${chip(x.band)}</td><td>${x.comp}%</td><td>${x.grammar}%</td><td>${fmtDate(x.created_at)}</td></tr>`).join("")}</table>` : `<p class="hint">No texts read yet.</p>`}</div>
  </div></div>`;
}
init();
</script>
</body>
</html>
